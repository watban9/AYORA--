<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أيورا للقرآن الكريم</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231b4d3e%22/><text x=%2250%%22 y=%2255%%22 font-size=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23d4af37%22>📖</text></svg>">
    <style>
        :root {
            --bg-color: #faf8f5;
            --text-color: #2c2c2c;
            --header-bg: #ffffff;
            --header-border: #e2d7c5;
            --accent-gold: #c5a059;
            --accent-green: #1b4d3e;
            --controls-bg: #f4efe6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1f1f1f;
            --header-border: #333333;
            --accent-gold: #d4af37;
            --accent-green: #2e7d32;
            --controls-bg: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; transition: background 0.3s, color 0.3s, opacity 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background-color: var(--header-bg); 
            padding: 10px 15px; 
            border-bottom: 2px solid var(--accent-gold); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { 
            width: 32px; height: 32px; background: var(--accent-green); color: var(--accent-gold); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid var(--accent-gold);
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 8px; 
            background: var(--controls-bg); 
            border-bottom: 1px solid var(--header-border); 
            gap: 8px; 
            flex-wrap: wrap; 
            z-index: 10;
        }
        
        select, button { 
            padding: 6px 12px; 
            background: var(--header-bg); 
            color: var(--text-color); 
            border: 1px solid var(--accent-gold); 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 13px;
        }
        
        .bookmark-btn { background: var(--accent-green); color: #fff; border: none; }
        .theme-btn { background: var(--accent-gold); color: #fff; border: none; }

        .audio-section {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 15px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            justify-content: center;
            z-index: 10;
        }

        audio {
            height: 32px;
            outline: none;
        }

        .viewer { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: var(--bg-color); 
            padding: 5px; 
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .viewer img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 6px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
        }
        
        .nav-buttons { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: var(--header-bg); 
            border-top: 1px solid var(--header-border); 
            z-index: 10;
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body data-theme="light">

    <header id="headerBar">
        <div class="logo-area">
            <div class="logo-icon">أ</div>
            <span style="font-weight: bold; color: var(--accent-gold);">AYORA - آيورا</span>
        </div>
        <div>
            <button class="bookmark-btn" onclick="saveBookmark()">حفظ علامة</button>
            <button class="bookmark-btn" style="background:#8b5a2b;" onclick="goToBookmark()">الانتقال للعلامة</button>
            <button class="theme-btn" onclick="toggleTheme()">الوضع</button>
        </div>
    </header>

    <div class="controls" id="controlsBar">
        <label for="surahSelect">السورة:</label>
        <select id="surahSelect" onchange="changeSurah()"></select>

        <label for="juzSelect">الجزء:</label>
        <select id="juzSelect" onchange="changeJuz()"></select>
    </div>

    <!-- قسم المشغل الصوتي -->
    <div class="audio-section" id="audioBar">
        <span style="font-size: 12px; font-weight: bold;">التلاوة:</span>
        <audio id="quranAudio" controls preload="none">
            <source id="audioSource" src="" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>
    </div>

    <!-- منطقة عرض صور المصحف -->
    <div class="viewer" onclick="toggleBars()">
        <img id="quranPage" src="" alt="صفحة المصحف">
    </div>

    <div class="nav-buttons" id="navBar">
        <button onclick="nextPage()">الصفحة التالية</button>
        <span id="pageInfo" style="font-weight: bold; color: var(--accent-green);">صفحة 1</span>
        <button onclick="prevPage()">الصفحة السابقة</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 604;
        let barsVisible = true;

        const juzPages = [1, 22, 42, 62, 82, 102, 122, 142, 162, 182, 202, 222, 242, 262, 282, 302, 322, 342, 362, 382, 402, 422, 442, 462, 482, 502, 522, 542, 562, 582];

        const surahs = [
            { id: 1, name: "الفاتحة", page: 1 }, { id: 2, name: "البقرة", page: 2 }, { id: 3, name: "آل عمران", page: 50 },
            { id: 4, name: "النساء", page: 77 }, { id: 5, name: "المائدة", page: 106 }, { id: 6, name: "الأنعام", page: 128 },
            { id: 7, name: "الأعراف", page: 151 }, { id: 8, name: "الأنفال", page: 177 }, { id: 9, name: "التوبة", page: 187 },
            { id: 10, name: "يونس", page: 208 }, { id: 11, name: "هود", page: 221 }, { id: 12, name: "يوسف", page: 235 },
            { id: 13, name: "الرعد", page: 249 }, { id: 14, name: "إبراهيم", page: 255 }, { id: 15, name: "الحجر", page: 262 },
            { id: 16, name: "النحل", page: 267 }, { id: 17, name: "الإسراء", page: 282 }, { id: 18, name: "الكهف", page: 293 },
            { id: 19, name: "مريم", page: 305 }, { id: 20, name: "طه", page: 312 }, { id: 21, name: "الأنبياء", page: 322 },
            { id: 22, name: "الحج", page: 332 }, { id: 23, name: "المؤمنون", page: 342 }, { id: 24, name: "النور", page: 350 },
            { id: 25, name: "الفرقان", page: 359 }, { id: 26, name: "الشعراء", page: 367 }, { id: 27, name: "النمل", page: 377 },
            { id: 28, name: "القصص", page: 385 }, { id: 29, name: "العنكبوت", page: 396 }, { id: 30, name: "الروم", page: 404 },
            { id: 31, name: "لقمان", page: 411 }, { id: 32, name: "السجدة", page: 415 }, { id: 33, name: "الأحزاب", page: 418 },
            { id: 34, name: "سبأ", page: 428 }, { id: 35, name: "فاطر", page: 434 }, { id: 36, name: "يس", page: 440 },
            { id: 37, name: "الصافات", page: 445 }, { id: 38, name: "ص", page: 453 }, { id: 39, name: "الزمر", page: 458 },
            { id: 40, name: "غافر", page: 467 }, { id: 41, name: "فصلت", page: 477 }, { id: 42, name: "الشورى", page: 483 },
            { id: 43, name: "الزخرف", page: 489 }, { id: 44, name: "الدخان", page: 496 }, { id: 45, name: "الجاثية", page: 499 },
            { id: 46, name: "الأحقاف", page: 502 }, { id: 47, name: "محمد", page: 507 }, { id: 48, name: "الفتح", page: 511 },
            { id: 49, name: "الحجرات", page: 515 }, { id: 50, name: "ق", page: 518 }, { id: 51, name: "الذاريات", page: 520 },
            { id: 52, name: "الطور", page: 523 }, { id: 53, name: "النجم", page: 526 }, { id: 54, name: "القمر", page: 528 },
            { id: 55, name: "الرحمن", page: 531 }, { id: 56, name: "الواقعة", page: 534 }, { id: 57, name: "الحديد", page: 537 },
            { id: 58, name: "المجادلة", page: 542 }, { id: 59, name: "الحشر", page: 545 }, { id: 60, name: "الممتحنة", page: 549 },
            { id: 61, name: "الصف", page: 551 }, { id: 62, name: "الجمعة", page: 553 }, { id: 63, name: "المنافقون", page: 554 },
            { id: 64, name: "التغابن", page: 556 }, { id: 65, name: "الطلاق", page: 558 }, { id: 66, name: "التحريم", page: 560 },
            { id: 67, name: "الملك", page: 562 }, { id: 68, name: "القلم", page: 564 }, { id: 69, name: "الحاقة", page: 566 },
            { id: 70, name: "المعارج", page: 568 }, { id: 71, name: "نوح", page: 570 }, { id: 72, name: "الجن", page: 572 },
            { id: 73, name: "المزمل", page: 574 }, { id: 74, name: "المدثر", page: 575 }, { id: 75, name: "القيامة", page: 577 },
            { id: 76, name: "الإنسان", page: 578 }, { id: 77, name: "المرسلات", page: 580 }, { id: 78, name: "النبأ", page: 582 },
            { id: 79, name: "النازعات", page: 583 }, { id: 80, name: "عبس", page: 585 }, { id: 81, name: "التكوير", page: 586 },
            { id: 82, name: "الانفطار", page: 587 }, { id: 83, name: "المطففين", page: 587 }, { id: 84, name: "الانشقاق", page: 589 },
            { id: 85, name: "البروج", page: 590 }, { id: 86, name: "الطارق", page: 591 }, { id: 87, name: "الأعلى", page: 591 },
            { id: 88, name: "الغاشية", page: 592 }, { id: 89, name: "الفجر", page: 593 }, { id: 90, name: "البلد", page: 594 },
            { id: 91, name: "الشمس", page: 595 }, { id: 92, name: "الليل", page: 595 }, { id: 93, name: "الضحى", page: 596 },
            { id: 94, name: "الشرح", page: 596 }, { id: 95, name: "التين", page: 597 }, { id: 96, name: "العلق", page: 597 },
            { id: 97, name: "القدر", page: 598 }, { id: 98, name: "البينة", page: 598 }, { id: 99, name: "الزلزلة", page: 599 },
            { id: 100, name: "العاديات", page: 599 }, { id: 101, name: "القارعة", page: 600 }, { id: 102, name: "التكاثر", page: 600 },
            { id: 103, name: "العصر", page: 601 }, { id: 104, name: "الهمزة", page: 601 }, { id: 105, name: "الفيل", page: 601 },
            { id: 106, name: "قريش", page: 602 }, { id: 107, name: "الماعون", page: 602 }, { id: 108, name: "الكوثر", page: 602 },
            { id: 109, name: "الكافرون", page: 603 }, { id: 110, name: "النصر", page: 603 }, { id: 111, name: "المسد", page: 603 },
            { id: 112, name: "الإخلاص", page: 604 }, { id: 113, name: "الفلق", page: 604 }, { id: 114, name: "الناس", page: 604 }
        ];

        function init() {
            const surahSel = document.getElementById('surahSelect');
            surahs.forEach((s) => {
                let opt = document.createElement('option');
                opt.value = s.page;
                opt.text = s.name;
                opt.setAttribute('data-id', s.id);
                surahSel.appendChild(opt);
            });

            const juzSel = document.getElementById('juzSelect');
            for (let i = 1; i <= 30; i++) {
                let opt = document.createElement('option');
                opt.value = juzPages[i - 1];
                opt.text = "الجزء " + i;
                juzSel.appendChild(opt);
            }

            let savedPage = localStorage.getItem('ayora_last_page');
            if (savedPage) {
                loadPage(parseInt(savedPage));
            } else {
                loadPage(1);
            }
        }

        function loadPage(page) {
            currentPage = page;
            let formattedPage = String(page).padStart(3, '0');
            document.getElementById('quranPage').src = `https://www.islamicbook.cc/quran/quran-${formattedPage}.jpg`;
            document.getElementById('pageInfo').innerText = `صفحة ${currentPage}`;
            
            // التحديث التلقائي لرابط الصوت للسورة التي تبدأ بها الصفحة
            updateAudioForCurrentPage(page);

            localStorage.setItem('ayora_last_page', currentPage);
        }

        function updateAudioForCurrentPage(page) {
            let currentSurah = surahs[0];
            for (let i = 0; i < surahs.length; i++) {
                if (surahs[i].page <= page) {
                    currentSurah = surahs[i];
                } else {
                    break;
                }
            }
            let formattedSurahId = String(currentSurah.id).padStart(3, '0');
            let audioPlayer = document.getElementById('quranAudio');
            let audioSrc = document.getElementById('audioSource');
            
            let newAudioUrl = `https://server8.mp3quran.net/afs/${formattedSurahId}.mp3`;
            if (audioSrc.src !== newAudioUrl) {
                audioSrc.src = newAudioUrl;
                audioPlayer.load();
            }
        }

        function changeSurah() {
            let page = parseInt(document.getElementById('surahSelect').value);
            loadPage(page);
        }

        function changeJuz() {
            let page = parseInt(document.getElementById('juzSelect').value);
            loadPage(page);
        }

        function nextPage() {
            if (currentPage > 1) {
                loadPage(currentPage - 1);
            }
        }

        function prevPage() {
            if (currentPage < totalPages) {
                loadPage(currentPage + 1);
            }
        }

        function saveBookmark() {
            localStorage.setItem('ayora_bookmark', currentPage);
            alert("تم حفظ العلامة عند صفحة " + currentPage);
        }

        function goToBookmark() {
            let bookmark = localStorage.getItem('ayora_bookmark');
            if (bookmark) {
                loadPage(parseInt(bookmark));
            } else {
                alert("لم تحفظ أي علامة بعد!");
            }
        }

        function toggleBars() {
            barsVisible = !barsVisible;
            document.getElementById('headerBar').classList.toggle('hidden', !barsVisible);
            document.getElementById('controlsBar').classList.toggle('hidden', !barsVisible);
            document.getElementById('audioBar').classList.toggle('hidden', !barsVisible);
            document.getElementById('navBar').classList.toggle('hidden', !barsVisible);
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        // تسجيل الـ Service Worker للعمل بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => { console.log('Service Worker registered!', reg); })
                    .catch((err) => { console.log('Service Worker registration failed:', err); });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
