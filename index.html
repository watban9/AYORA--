<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أيورا للقرآن الكريم</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231b4d3e%22/><text x=%2250%%22 y=%2255%%22 font-size=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23d4af37%22>📖</text></svg>">
    <style>
        :root {
            --bg-color: #faf8f5;
            --text-color: #2c2c2c;
            --header-bg: #ffffff;
            --header-border: #e2d7c5;
            --accent-gold: #c5a059;
            --accent-green: #1b4d3e;
            --controls-bg: #f4efe6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1f1f1f;
            --header-border: #333333;
            --accent-gold: #d4af37;
            --accent-green: #2e7d32;
            --controls-bg: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; transition: background 0.3s, color 0.3s, opacity 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background-color: var(--header-bg); 
            padding: 10px 15px; 
            border-bottom: 2px solid var(--accent-gold); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { 
            width: 32px; height: 32px; background: var(--accent-green); color: var(--accent-gold); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid var(--accent-gold);
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 8px; 
            background: var(--controls-bg); 
            border-bottom: 1px solid var(--header-border); 
            gap: 8px; 
            flex-wrap: wrap; 
            z-index: 10;
        }
        
        select, button { 
            padding: 6px 12px; 
            background: var(--header-bg); 
            color: var(--text-color); 
            border: 1px solid var(--accent-gold); 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 13px;
        }
        
        .bookmark-btn { background: var(--accent-green); color: #fff; border: none; }
        .theme-btn { background: var(--accent-gold); color: #fff; border: none; }

        .viewer { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: var(--bg-color); 
            padding: 5px; 
            cursor: pointer;
            position: relative;
        }

        /* صور مصحف المدينة المنورة */
        .viewer img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 6px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
        }
        
        .nav-buttons { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: var(--header-bg); 
            border-top: 1px solid var(--header-border); 
            z-index: 10;
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body data-theme="light">

    <header id="headerBar">
        <div class="logo-area">
            <div class="logo-icon">أ</div>
            <span style="font-weight: bold; color: var(--accent-gold);">AYORA - آيورا</span>
        </div>
        <div>
            <button class="bookmark-btn" onclick="saveBookmark()">حفظ علامة</button>
            <button class="bookmark-btn" style="background:#8b5a2b;" onclick="goToBookmark()">الانتقال للعلامة</button>
            <button class="theme-btn" onclick="toggleTheme()">الوضع</button>
        </div>
    </header>

    <div class="controls" id="controlsBar">
        <label for="surahSelect">السورة:</label>
        <select id="surahSelect" onchange="changeSurah()"></select>

        <label for="juzSelect">الجزء:</label>
        <select id="juzSelect" onchange="changeJuz()"></select>
    </div>

    <!-- منطقة عرض صور المصحف -->
    <div class="viewer" onclick="toggleBars()">
        <img id="quranPage" src="" alt="صفحة المصحف - مصحف المدينة">
    </div>

    <div class="nav-buttons" id="navBar">
        <button onclick="nextPage()">الصفحة التالية</button>
        <span id="pageInfo" style="font-weight: bold; color: var(--accent-green);">صفحة 1</span>
        <button onclick="prevPage()">الصفحة السابقة</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 604;
        let barsVisible = true;

        // خريطة بداية الأجزاء في مصحف المدينة
        const juzPages = [1, 22, 42, 62, 82, 102, 122, 142, 162, 182, 202, 222, 242, 262, 282, 302, 322, 342, 362, 382, 402, 422, 442, 462, 482, 502, 522, 542, 562, 582];

        // عينة من السور ورقم صفحاتها في مصحف المدينة
        const surahs = [
            { name: "الفاتحة", page: 1 }, { name: "البقرة", page: 2 }, { name: "آل عمران", page: 50 },
            { name: "النساء", page: 77 }, { name: "المائدة", page: 106 }, { name: "الأنعام", page: 128 },
            { name: "الأعراف", page: 151 }, { name: "الأنفال", page: 177 }, { name: "التوبة", page: 187 },
            { name: "يونس", page: 208 }, { name: "هود", page: 221 }, { name: "يوسف", page: 235 },
            { name: "الرعد", page: 249 }, { name: "إبراهيم", page: 255 }, { name: "الحجر", page: 262 },
            { name: "النحل", page: 267 }, { name: "الإسراء", page: 282 }, { name: "الكهف", page: 293 },
            { name: "مريم", page: 305 }, { name: "طه", page: 312 }, { name: "الأنبياء", page: 322 },
            { name: "الحج", page: 332 }, { name: "المؤمنون", page: 342 }, { name: "النور", page: 350 },
            { name: "الفرقان", page: 359 }, { name: "الشعراء", page: 367 }, { name: "النمل", page: 377 },
            { name: "القصص", page: 385 }, { name: "العنكبوت", page: 396 }, { name: "الروم", page: 404 },
            { name: "لقمان", page: 411 }, { name: "السجدة", page: 415 }, { name: "الأحزاب", page: 418 },
            { name: "سبأ", page: 428 }, { name: "فاطر", page: 434 }, { name: "يس", page: 440 },
            { name: "الصافات", page: 445 }, { name: "ص", page: 453 }, { name: "الزمر", page: 458 },
            { name: "غافر", page: 467 }, { name: "فصلت", page: 477 }, { name: "الشورى", page: 483 },
            { name: "الزخرف", page: 489 }, { name: "الدخان", page: 496 }, { name: "الجاثية", page: 499 },
            { name: "الأحقاف", page: 502 }, { name: "محمد", page: 507 }, { name: "الفتح", page: 511 },
            { name: "الحجرات", page: 515 }, { name: "ق", page: 518 }, { name: "الذاريات", page: 520 },
            { name: "الطور", page: 523 }, { name: "النجم", page: 526 }, { name: "القمر", page: 528 },
            { name: "الرحمن", page: 531 }, { name: "الواقعة", page: 534 }, { name: "الحديد", page: 537 },
            { name: "المجادلة", page: 542 }, { name: "الحشر", page: 545 }, { name: "الممتحنة", page: 549 },
            { name: "الصف", page: 551 }, { name: "الجمعة", page: 553 }, { name: "المنافقون", page: 554 },
            { name: "التغابن", page: 556 }, { name: "الطلاق", page: 558 }, { name: "التحريم", page: 560 },
            { name: "الملك", page: 562 }, { name: "القلم", page: 564 }, { name: "الحاقة", page: 566 },
            { name: "المعارج", page: 568 }, { name: "نوح", page: 570 }, { name: "الجن", page: 572 },
            { name: "المزمل", page: 574 }, { name: "المدثر", page: 575 }, { name: "القيامة", page: 577 },
            { name: "الإنسان", page: 578 }, { name: "المرسلات", page: 580 }, { name: "النبأ", page: 582 },
            { name: "النازعات", page: 583 }, { name: "عبس", page: 585 }, { name: "التكوير", page: 586 },
            { name: "الانفطار", page: 587 }, { name: "المطففين", page: 587 }, { name: "الانشقاق", page: 589 },
            { name: "البروج", page: 590 }, { name: "الطارق", page: 591 }, { name: "الأعلى", page: 591 },
            { name: "الغاشية", page: 592 }, { name: "الفجر", page: 593 }, { name: "البلد", page: 594 },
            { name: "الشمس", page: 595 }, { name: "الليل", page: 595 }, { name: "الضحى", page: 596 },
            { name: "الشرح", page: 596 }, { name: "التين", page: 597 }, { name: "العلق", page: 597 },
            { name: "القدر", page: 598 }, { name: "البينة", page: 598 }, { name: "الزلزلة", page: 599 },
            { name: "العاديات", page: 599 }, { name: "القارعة", page: 600 }, { name: "التكاثر", page: 600 },
            { name: "العصر", page: 601 }, { name: "الهمزة", page: 601 }, { name: "الفيل", page: 601 },
            { name: "قريش", page: 602 }, { name: "الماعون", page: 602 }, { name: "الكوثر", page: 602 },
            { name: "الكافرون", page: 603 }, { name: "النصر", page: 603 }, { name: "المسد", page: 603 },
            { name: "الإخلاص", page: 604 }, { name: "الفلق", page: 604 }, { name: "الناس", page: 604 }
        ];

        function init() {
            // تعبئة قائمة السور
            const surahSel = document.getElementById('surahSelect');
            surahs.forEach((s) => {
                let opt = document.createElement('option');
                opt.value = s.page;
                opt.text = s.name;
                surahSel.appendChild(opt);
            });

            // تعبئة قائمة الأجزاء
            const juzSel = document.getElementById('juzSelect');
            for (let i = 1; i <= 30; i++) {
                let opt = document.createElement('option');
                opt.value = juzPages[i - 1];
                opt.text = "الجزء " + i;
                juzSel.appendChild(opt);
            }

            // استرجاع آخر صفحة قرأها المستخدم
            let savedPage = localStorage.getItem('ayora_last_page');
            if (savedPage) {
                loadPage(parseInt(savedPage));
            } else {
                loadPage(1);
            }
        }

        function loadPage(page) {
            currentPage = page;
            let formattedPage = String(page).padStart(3, '0');
            // رابط صور صفحات مصحف المدينة المنورة العالية الجودة
            document.getElementById('quranPage').src = `https://www.quranapp.org/pages/p${formattedPage}.png`;
            document.getElementById('pageInfo').innerText = `صفحة ${currentPage}`;
            
            // حفظ الصفحة الحالية تلقائياً
            localStorage.setItem('ayora_last_page', currentPage);
        }

        function changeSurah() {
            let page = parseInt(document.getElementById('surahSelect').value);
            loadPage(page);
        }

        function changeJuz() {
            let page = parseInt(document.getElementById('juzSelect').value);
            loadPage(page);
        }

        function nextPage() {
            if (currentPage > 1) { // في المصحف الصفحة التالية تكون على اليمين (رقم أقل)
                loadPage(currentPage - 1);
            }
        }

        function prevPage() {
            if (currentPage < totalPages) {
                loadPage(currentPage + 1);
            }
        }

        function saveBookmark() {
            localStorage.setItem('ayora_bookmark', currentPage);
            alert("تم حفظ العلامة عند صفحة " + currentPage);
        }

        function goToBookmark() {
            let bookmark = localStorage.getItem('ayora_bookmark');
            if (bookmark) {
                loadPage(parseInt(bookmark));
            } else {
                alert("لم تحفظ أي علامة بعد!");
            }
        }

        function toggleBars() {
            barsVisible = !barsVisible;
            document.getElementById('headerBar').classList.toggle('hidden', !barsVisible);
            document.getElementById('controlsBar').classList.toggle('hidden', !barsVisible);
            document.getElementById('navBar').classList.toggle('hidden', !barsVisible);
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        window.onload = init;
    </script>
</body>
</html>
